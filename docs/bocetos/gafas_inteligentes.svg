<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <!-- Boceto conceptual (no implementado): SILVA en gafas inteligentes -->
  <rect width="1200" height="760" fill="#0b1120"/>
  <text x="40" y="52" fill="#f1f5f9" font-size="28" font-weight="700">SILVA en gafas inteligentes · boceto</text>
  <text x="40" y="84" fill="#94a3b8" font-size="17">Lo que ve la persona oyente: la persona sorda signa frente a ella y SILVA subtitula en el lente.</text>

  <!-- escena vista a través de las gafas -->
  <defs>
    <clipPath id="lentes">
      <path d="M90 170 h420 a40 40 0 0 1 40 40 v230 a120 120 0 0 1 -120 120 h-200 a140 140 0 0 1 -140 -140 v-210 a40 40 0 0 1 40 -40 z"/>
      <path d="M650 170 h420 a40 40 0 0 1 40 40 v210 a140 140 0 0 1 -140 140 h-200 a120 120 0 0 1 -120 -120 v-230 a40 40 0 0 1 40 -40 z"/>
    </clipPath>
    <linearGradient id="pared" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#lentes)">
    <rect x="50" y="150" width="1100" height="440" fill="url(#pared)"/>
    <rect x="50" y="470" width="1100" height="120" fill="#64748b"/>
    <g transform="translate(-282 18)">
    <!-- persona que signa (silueta) -->
    <g fill="#334155">
      <ellipse cx="600" cy="255" rx="46" ry="56"/>
      <path d="M520 330 q80 -30 160 0 l30 260 h-220 z"/>
      <path d="M520 338 l-62 70 l40 -112 z" />
    </g>
    <g stroke="#334155" stroke-width="26" stroke-linecap="round" fill="none">
      <path d="M528 340 L470 410 L520 250"/>
      <path d="M672 340 L700 450 L640 470"/>
    </g>
    <g fill="#334155">
      <ellipse cx="522" cy="232" rx="24" ry="30"/>
      <ellipse cx="636" cy="470" rx="26" ry="18"/>
    </g>
    <!-- HUD: puntos de la mano detectada -->
    <g fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.9">
      <rect x="486" y="190" width="76" height="86" rx="10"/>
    </g>
    </g>
    <!-- HUD: subtítulo bajo la persona (lente izquierdo) -->
    <rect x="130" y="448" width="380" height="84" rx="18" fill="#020617" opacity="0.84"/>
    <text x="152" y="478" fill="#22c55e" font-size="15" font-weight="700">SILVA · EN VIVO</text>
    <text x="152" y="514" fill="#f1f5f9" font-size="30" font-weight="700">Hola · ¿Cómo está?</text>
    <!-- HUD: conversación (lente derecho) -->
    <rect x="700" y="210" width="370" height="250" rx="18" fill="#020617" opacity="0.72"/>
    <text x="722" y="244" fill="#94a3b8" font-size="15" font-weight="700">CONVERSACIÓN</text>
    <text x="722" y="284" fill="#f1f5f9" font-size="20">🤟  Hola · ¿Cómo está?</text>
    <text x="722" y="322" fill="#93c5fd" font-size="20">💬  Bien, gracias. ¿En qué le ayudo?</text>
    <text x="722" y="360" fill="#f1f5f9" font-size="20">🤟  Necesitar · Ayudar</text>
    <rect x="722" y="392" width="200" height="44" rx="22" fill="#3b82f6"/>
    <text x="748" y="421" fill="#ffffff" font-size="17" font-weight="600">🎤  Responder</text>
    <!-- HUD: palabra en curso en el lente izquierdo -->
    <rect x="360" y="198" width="172" height="40" rx="20" fill="#7f1d1d" opacity="0.85"/>
    <circle cx="384" cy="218" r="7" fill="#f87171"/>
    <text x="398" y="225" fill="#fee2e2" font-size="17" font-weight="600">Leyendo seña…</text>
  </g>

  <!-- montura -->
  <g fill="none" stroke="#1e293b" stroke-width="22" stroke-linejoin="round">
    <path d="M90 170 h420 a40 40 0 0 1 40 40 v230 a120 120 0 0 1 -120 120 h-200 a140 140 0 0 1 -140 -140 v-210 a40 40 0 0 1 40 -40 z"/>
    <path d="M650 170 h420 a40 40 0 0 1 40 40 v210 a140 140 0 0 1 -140 140 h-200 a120 120 0 0 1 -120 -120 v-230 a40 40 0 0 1 40 -40 z"/>
    <path d="M550 230 q50 -34 100 0"/>
    <path d="M50 200 h-40"/><path d="M1150 200 h40"/>
  </g>
  <!-- cámara en el puente -->
  <circle cx="600" cy="196" r="13" fill="#0f172a" stroke="#3b82f6" stroke-width="4"/>

  <!-- anotaciones -->
  <g font-size="16" fill="#cbd5e1">
    <line x1="600" y1="182" x2="600" y2="120" stroke="#3b82f6" stroke-width="2"/>
    <text x="612" y="128" fill="#93c5fd">1 · Cámara frontal: ve las manos y el torso de quien signa</text>
    <text x="40" y="640" font-weight="700" fill="#f1f5f9">Cómo funcionaría</text>
    <text x="40" y="668">2 · El mismo reconocimiento de SILVA (MediaPipe + modelos) corre en el celular vinculado, sin internet.</text>
    <text x="40" y="694">3 · El texto aparece como subtítulo en el lente; la persona oyente no tiene que mirar otra pantalla.</text>
    <text x="40" y="720">4 · Para responder, la persona oyente escribe o habla en el celular y la persona sorda lo ve en texto o en señas animadas.</text>
    <text x="40" y="746" fill="#64748b" font-size="14">Boceto conceptual, no implementado: requiere gafas con cámara y pantalla (realidad aumentada) y una versión móvil de SILVA.</text>
  </g>
</svg>
